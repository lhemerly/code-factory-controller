name: Verify controller
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  rust-and-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python3 scripts/test-trace-ledger.py
      - run: python3 scripts/test-goal-runner.py
      - run: python3 scripts/test-goal-acceptance.py
      - run: python3 scripts/test-cli-updater.py
      - run: python3 scripts/test-research-dispatch.py
      - run: python3 scripts/test-dispatch-queue.py
      - run: python3 scripts/test-queue-handoff.py
      - run: python3 scripts/test-github-review.py
      - run: node --experimental-strip-types scripts/test-pstack-github.mjs
      - run: node scripts/test-continuous-ownership.mjs
      - run: node scripts/test-free-model-policy.mjs
      - run: node scripts/test-research-context.mjs
      - name: Test local Bonsai OpenCode transport (mock inference only)
        run: |
          npm install --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/bonsai-runtime" opencode-linux-x64-baseline@1.19.0
          python3 scripts/test-bonsai-protocol.py --opencode "$RUNNER_TEMP/bonsai-runtime/node_modules/opencode-linux-x64-baseline/bin/opencode"
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - name: Exercise two-goal owner CLI (fake providers, real verification)
        run: |
          python3 scripts/test-dispatch-cli.py
          python3 scripts/test-queue-cli.py
          python3 scripts/test-github-controller.py
      - run: cargo run --locked -- schemas --output schemas
      - run: git diff --exit-code -- schemas
      - name: Load independent plugin consumer
        run: |
          git clone https://github.com/lhemerly/opencode-factory-plugin.git /tmp/factory-plugin
          git -C /tmp/factory-plugin checkout 7cfea868c961b90bfeca5399b1246f157e70ee97
          npm --prefix /tmp/factory-plugin ci
          npm --prefix /tmp/factory-plugin run build
      - run: node scripts/plugin-contract.mjs
        env:
          FACTORY_PLUGIN_DIR: /tmp/factory-plugin
      - run: node scripts/plugin-contract.mjs --crash-verification
        env:
          FACTORY_PLUGIN_DIR: /tmp/factory-plugin
      - run: cargo package --locked --allow-dirty --no-verify
