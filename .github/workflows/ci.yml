name: Verify controller
on:
  push:
    branches: [main, "factory/**"]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  rust-and-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python3 scripts/test-trace-ledger.py
      - run: python3 scripts/test-goal-runner.py
      - run: python3 scripts/test-goal-acceptance.py
      - run: python3 scripts/test-cli-updater.py
      - name: Test dashboard synthetic state and read-only HTTP (no private capture)
        run: python3 -m unittest dashboard.tests.test_current_state dashboard.tests.test_fixtures dashboard.tests.test_loader_safety dashboard.tests.test_server dashboard.tests.test_state_root
      - run: python3 scripts/test-research-dispatch.py
      - run: python3 scripts/test-worker-regression-fixture.py
      - run: python3 scripts/test-dispatch-queue.py
      - run: python3 scripts/test-queue-handoff.py
      - run: python3 scripts/test-github-review.py
      - run: python3 scripts/test-main-publication.py
      - run: node --experimental-strip-types scripts/test-pstack-github.mjs
      - run: node scripts/test-continuous-ownership.mjs
      - run: node scripts/test-free-model-policy.mjs
      - run: node scripts/test-research-context.mjs
      - run: node scripts/test-native-plugin-readiness.mjs
      - run: node scripts/test-native-plugin-readiness-recovery.mjs
      - run: node scripts/test-native-plugin-readiness-failclosed.mjs
      - run: node scripts/test-native-session-inventory.mjs
      - name: Test worker filesystem and PID boundaries (no providers)
        run: |
          sudo apt-get update
          sudo apt-get install -y apparmor bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor.
          # Permit the test launcher specifically; keep the tests unprivileged.
          sudo tee /etc/apparmor.d/code-factory-ci-bwrap > /dev/null <<'PROFILE'
          abi <abi/4.0>,
          profile code-factory-ci-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser --replace /etc/apparmor.d/code-factory-ci-bwrap
          node scripts/test-coding-sandbox.mjs
          node scripts/test-spark-sandbox.mjs
      - name: Test local Bonsai OpenCode transport (mock inference only)
        run: |
          npm install --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/bonsai-runtime" opencode-linux-x64-baseline@1.19.0
          python3 scripts/test-bonsai-protocol.py --opencode "$RUNNER_TEMP/bonsai-runtime/node_modules/opencode-linux-x64-baseline/bin/opencode"
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - name: Check Rust goal runtime against Python state and receipt contracts
        run: |
          python3 scripts/test-rust-goal-acceptance.py
          python3 scripts/test-rust-goal-runner.py
      - name: Check Rust recovery and utility compatibility (local fixtures only)
        run: |
          python3 scripts/test-rust-permission-resolution.py
          python3 scripts/test-rust-owner-interruption.py
          python3 scripts/test-rust-spark-control.py
          python3 scripts/test-rust-scope-recovery.py
          python3 scripts/test-rust-trace-ledger.py
          python3 scripts/test-rust-pre-admission.py
          python3 scripts/test-rust-trace-contention.py
          python3 scripts/test-rust-check-bonsai.py
      - name: Exercise two-goal owner CLI (fake providers, real verification)
        run: |
          python3 scripts/test-dispatch-cli.py
          python3 scripts/test-goal-feedback-cli.py
          FACTORY_FIXTURE_TEST_HOST_EXIT=1 python3 scripts/test-goal-feedback-cli.py
          python3 scripts/test-goal-process-lifecycle.py
          python3 scripts/test-goal-baseline-cli.py
          python3 scripts/test-queue-cli.py
          python3 scripts/test-github-controller.py
          python3 scripts/test-main-controller.py
      - run: cargo run --locked -- schemas --output schemas
      - run: git diff --exit-code -- schemas
      - name: Load independent plugin consumer
        run: |
          git clone https://github.com/lhemerly/opencode-factory-plugin.git /tmp/factory-plugin
          git -C /tmp/factory-plugin checkout 7cfea868c961b90bfeca5399b1246f157e70ee97
          npm --prefix /tmp/factory-plugin ci
          npm --prefix /tmp/factory-plugin run build
      - run: node scripts/plugin-contract.mjs
        env:
          FACTORY_PLUGIN_DIR: /tmp/factory-plugin
      - run: node scripts/plugin-contract.mjs --crash-verification
        env:
          FACTORY_PLUGIN_DIR: /tmp/factory-plugin
      - run: cargo package --locked --allow-dirty --no-verify
